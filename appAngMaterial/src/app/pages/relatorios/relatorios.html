<div class="relatorios-page">
  <h1 class="page-title">Relatórios</h1>

  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-icon mat-card-avatar>assessment</mat-icon>
      <mat-card-title>Relatórios Gerados</mat-card-title>
      <mat-card-subtitle>Histórico de relatórios disponíveis para download</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <table mat-table [dataSource]="relatorios()" class="relatorios-table">
        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let item">{{ item.nome }}</td>
        </ng-container>

        <ng-container matColumnDef="tipo">
          <th mat-header-cell *matHeaderCellDef>Tipo</th>
          <td mat-cell *matCellDef="let item">{{ item.tipo }}</td>
        </ng-container>

        <ng-container matColumnDef="dataGeracao">
          <th mat-header-cell *matHeaderCellDef>Data de Geração</th>
          <td mat-cell *matCellDef="let item">{{ item.dataGeracao | date: 'dd/MM/yyyy' }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let item">
            <mat-chip [class]="'status-' + item.status">{{ getStatusLabel(item.status) }}</mat-chip>
          </td>
        </ng-container>

        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef>Ações</th>
          <td mat-cell *matCellDef="let item">
            <button
              mat-icon-button
              [disabled]="item.status !== 'concluido'"
              (click)="baixar(item)"
              aria-label="Baixar relatório"
            >
              <mat-icon>download</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="colunas"></tr>
        <tr mat-row *matRowDef="let row; columns: colunas"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
